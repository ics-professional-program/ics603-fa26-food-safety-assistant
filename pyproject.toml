[project]
name = "foodsafety-rag"
version = "0.1.0"
description = "ICS 603 food-safety compliance assistant - RAG grounded Q&A reference app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "nbformat>=5.10", "jupyterlab>=4"]

[tool.setuptools]
packages = ["foodsafety_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
